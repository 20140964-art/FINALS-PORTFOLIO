<div class="contacts-container">
  <h1 class="text-center mb-4">
    <i class="bi bi-envelope"></i> Get in Touch
  </h1>

  <p class="text-center mb-4">
    Fill out the form below and I’ll get back to you as soon as possible.
  </p>

  <form>
    <!-- Name -->
    <div class="mb-3">
      <label for="name" class="form-label">Full Name</label>
      <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
    </div>

    <!-- Subject -->
    <div class="mb-3">
      <label for="subject" class="form-label">Subject</label>
      <input type="text" class="form-control" id="subject" placeholder="Enter subject" required>
    </div>

    <!-- Message -->
    <div class="mb-3">
      <label for="message" class="form-label">Message</label>
      <textarea class="form-control" id="message" rows="5" placeholder="Write your message here..." required></textarea>
    </div>

    <!-- Submit Button -->
    <div class="text-center">
      <button type="submit" class="btn zzz-btn">
        <i class="bi bi-send-fill"></i> Send Message
      </button>
    </div>
  </form>

  <hr class="my-5">

  <!-- Social Media -->
  <div class="text-center">
    <h3><i class="bi bi-share-fill"></i> Connect with me</h3>
    <div class="d-flex justify-content-center mt-3">
      <a href="https://github.com/username" target="_blank" class="mx-3 fs-3">
        <i class="bi bi-github"></i>
      </a>
      <a href="https://linkedin.com/in/username" target="_blank" class="mx-3 fs-3">
        <i class="bi bi-linkedin"></i>
      </a>
      <a href="https://facebook.com/username" target="_blank" class="mx-3 fs-3">
        <i class="bi bi-facebook"></i>
      </a>
    </div>
  </div>
</div>
